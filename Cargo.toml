[package]
name = "webshotd"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
chromiumoxide = "0.9.1"
clap = { version = "4.6.6", features = ["derive"] }
futures = "0.3.34"
libvips = "2.3.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = "0.7.19"
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["timeout", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = { version = "2.5.8", features = ["serde"] }
